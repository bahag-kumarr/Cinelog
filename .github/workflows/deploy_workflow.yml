name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - ravi
  pull_request:
    branches:
      - main

jobs:
  basic-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Build Backend
        working-directory: ./backend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm install

      - name: Workflow completed
        run: echo "Frontend and backend built successfully"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: basic-ci
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set BACKEND_IMAGE_URL
        run: echo "BACKEND_IMAGE_URL=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPOSITORY }}/${{ vars.BACKEND_IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Build image
        working-directory: ./backend
        run: |
            docker build \
            --no-cache \
            --platform linux/amd64 \
            -t $BACKEND_IMAGE_URL \
            .

      - name: Push image
        run: docker push $BACKEND_IMAGE_URL

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.BACKEND_SERVICE_NAME }} \
            --image $BACKEND_IMAGE_URL \
            --platform managed \
            --region ${{ vars.REGION }} \
            --allow-unauthenticated \
            --set-env-vars "\
              DB_HOST=${{ vars.DB_HOST }},\
              DB_USER=${{ vars.DB_USER }},\
              DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
              DB_NAME=${{ vars.DB_NAME }},\
              DB_PORT=${{ vars.DB_PORT }},\
              FRONTEND_URL=${{ vars.FRONTEND_URL }},\
              JWT_SECRET=${{ vars.JWT_SECRET }}"
  
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: basic-ci
    # if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ravi') && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set FRONTEND_IMAGE_URL
        run: echo "FRONTEND_IMAGE_URL=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPOSITORY }}/${{ vars.FRONTEND_IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Build image
        working-directory: ./frontend
        run: |
          docker build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            -t $FRONTEND_IMAGE_URL \
            .

      - name: Push image
        run: docker push $FRONTEND_IMAGE_URL

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.FRONTEND_SERVICE_NAME }} \
            --image $FRONTEND_IMAGE_URL \
            --platform managed \
            --region ${{ vars.REGION }} \
            --allow-unauthenticated \
            --port 8080