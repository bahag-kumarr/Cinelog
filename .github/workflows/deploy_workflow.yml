name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - ravi
  pull_request:
    branches:
      - main

jobs:
  basic-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Build Backend
        working-directory: ./backend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm install

      - name: Workflow completed
        run: echo "Frontend and backend built successfully"

  deploy:
    runs-on: ubuntu-latest
    needs: basic-ci
    # if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_URL
        run: echo "IMAGE_URL=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.REPOSITORY }}/${{ vars.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Echo
        run: echo "Successfully authenticated in Google cloud"

